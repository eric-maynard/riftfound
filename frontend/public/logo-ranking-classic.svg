<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 174"
     width="174" height="174" role="img" aria-label="Riftbound ranking logo, shaded trophy">
  <title>Riftbound ranking logo, shaded trophy</title>
  <desc>The orange rift swirl with a shaded gold two-handled trophy at the lower right.</desc>

  <defs>
    <!-- one long blade; the swirl is this path rotated 8 times -->
    <path id="blade" d="M 103.00 89.00 C 106.73 88.31 120.33 87.03 125.38 84.86 C 130.44 82.69 131.58 79.46 133.32 75.98
             C 135.06 72.50 135.89 68.23 135.83 63.97 C 135.77 59.71 134.84 54.88 132.95 50.42 C 131.06 45.96
             128.21 41.21 124.52 37.21 C 120.82 33.21 116.09 29.27 110.80 26.43 C 105.52 23.60 99.20 21.18
             92.81 20.19 C 86.42 19.21 75.84 20.47 72.45 20.53 C 75.75 21.50 86.52 23.71 92.29 26.32 C 98.06
             28.94 103.04 32.57 107.08 36.23 C 111.11 39.89 114.20 44.23 116.50 48.28 C 118.80 52.33 120.13
             56.67 120.89 60.55 C 121.65 64.42 121.54 68.25 121.06 71.54 C 120.58 74.83 119.43 77.83 118.01
             80.28 C 116.60 82.73 115.08 84.79 112.58 86.24 C 110.08 87.69 104.60 88.54 103.00 89.00 Z"/>
    <!-- shorter inner wisp, interleaved between the long blades -->
    <path id="wisp" d="M 100.00 89.00 C 102.23 88.55 110.24 87.65 113.40 86.27 C 116.55 84.90 117.59 82.90 118.91 80.74
            C 120.23 78.58 121.02 75.96 121.32 73.30 C 121.62 70.63 121.43 67.63 120.71 64.74 C 119.98 61.86
            118.73 58.77 116.97 55.99 C 115.21 53.20 112.88 50.37 110.13 48.04 C 107.39 45.70 104.07 43.48
            100.50 41.98 C 96.94 40.47 90.70 39.52 88.74 39.03 C 90.53 40.12 96.42 43.16 99.48 45.56 C
            102.53 47.96 105.07 50.71 107.10 53.42 C 109.13 56.13 110.61 59.07 111.67 61.82 C 112.73 64.58
            113.26 67.40 113.48 69.95 C 113.69 72.50 113.44 74.96 112.96 77.12 C 112.48 79.28 111.63 81.25
            110.59 82.89 C 109.56 84.53 108.51 85.94 106.74 86.96 C 104.98 87.98 101.12 88.66 100.00 89.00 Z"/>
    <linearGradient id="cupGold" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#B8811B"/>
      <stop offset="22%" stop-color="#F7D873"/>
      <stop offset="52%" stop-color="#E8B22E"/>
      <stop offset="80%" stop-color="#B8811B"/>
      <stop offset="100%" stop-color="#9A6A12"/>
    </linearGradient>
    <linearGradient id="rimGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8811B"/>
      <stop offset="25%" stop-color="#FFF0B0"/>
      <stop offset="60%" stop-color="#E8B22E"/>
      <stop offset="100%" stop-color="#9A6A12"/>
    </linearGradient>
    <linearGradient id="stemGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8811B"/>
      <stop offset="30%" stop-color="#F7D873"/>
      <stop offset="100%" stop-color="#9A6A12"/>
    </linearGradient>
    <linearGradient id="footGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A6A12"/>
      <stop offset="30%" stop-color="#E8B22E"/>
      <stop offset="100%" stop-color="#7E550E"/>
    </linearGradient>
    <linearGradient id="handleGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7D873"/>
      <stop offset="100%" stop-color="#B8811B"/>
    </linearGradient>
  </defs>

  <!-- ============ rift swirl ============ -->
  <g id="swirl" fill="#EF7D01" stroke="#4A2703" stroke-width="0.9"
     stroke-linejoin="round">
    <use href="#blade" transform="rotate(0 87 89)"/>
    <use href="#blade" transform="rotate(45 87 89)"/>
    <use href="#blade" transform="rotate(90 87 89)"/>
    <use href="#blade" transform="rotate(135 87 89)"/>
    <use href="#blade" transform="rotate(180 87 89)"/>
    <use href="#blade" transform="rotate(225 87 89)"/>
    <use href="#blade" transform="rotate(270 87 89)"/>
    <use href="#blade" transform="rotate(315 87 89)"/>

    <!-- inner wisps, offset half a step -->
    <use href="#wisp" transform="rotate(22.5 87 89)"/>
    <use href="#wisp" transform="rotate(67.5 87 89)"/>
    <use href="#wisp" transform="rotate(112.5 87 89)"/>
    <use href="#wisp" transform="rotate(157.5 87 89)"/>
    <use href="#wisp" transform="rotate(202.5 87 89)"/>
    <use href="#wisp" transform="rotate(247.5 87 89)"/>
    <use href="#wisp" transform="rotate(292.5 87 89)"/>
    <use href="#wisp" transform="rotate(337.5 87 89)"/>
  </g>

  <!-- ============ trophy ============ -->
  <g id="trophy" transform="translate(5 6) translate(115 113) scale(0.90) translate(-115 -113)" stroke="#4A2703" stroke-width="2"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- handles: a dark pass for the outline, a gold pass on top -->
    <path d="M 91 81 C 76 79 68 89 71 100 C 73.5 108.5 84 112 95 109" fill="none" stroke-width="10"/>
    <path d="M 139 81 C 154 79 162 89 159 100 C 156.5 108.5 146 112 135 109" fill="none" stroke-width="10"/>
    <path d="M 91 81 C 76 79 68 89 71 100 C 73.5 108.5 84 112 95 109" fill="none" stroke="url(#handleGold)" stroke-width="6"/>
    <path d="M 139 81 C 154 79 162 89 159 100 C 156.5 108.5 146 112 135 109" fill="none" stroke="url(#handleGold)" stroke-width="6"/>

    <!-- cup -->
    <path d="M 89 77 C 89 94 94 110 100 119 C 103 123 105 125 107 126 L 123 126 C 125 125 127 123 130 119 C 136 110 141 94 141 77 Z" fill="url(#cupGold)"/>
      <!-- specular sheen on the left of the bowl -->
      <path d="M 97 79 C 97 95 100 109 105 118 C 101 118 98 115 96 110 C 93 102 92 88 92.5 79 Z" fill="#FFF3C4" fill-opacity="0.45" stroke="none"/>
    <rect x="85" y="66" width="60" height="11" rx="5.5" fill="url(#rimGold)"/>

    <!-- stem and pedestal -->
    <path d="M 108 126 L 122 126 L 119.5 139 L 110.5 139 Z" fill="url(#stemGold)"/>
    <path d="M 105 139 L 125 139 L 130 150 L 100 150 Z" fill="url(#stemGold)"/>
    <rect x="94" y="149" width="42" height="12" rx="4" fill="url(#footGold)"/>
  </g>
</svg>
