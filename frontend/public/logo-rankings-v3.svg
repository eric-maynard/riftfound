22.56 1080.91 1622.56 1267.51C1622.56 1281.78 1622.14 1295.96 1621.31 1310.02C1621.18 1312.43 1621.03 1314.85 1620.87 1317.24C1590.32 1788.69 1214.52 1907.37 1085.42 1932.86C1080.93 1933.74 1079.16 1927.31 1083.47 1925.74C1375.07 1819.64 1471.78 1559.32 1501.53 1433.52C1503.84 1423.76 1490.7 1418.35 1485.4 1426.86C1358.25 1631.11 1123.32 1703.6 1048.27 1722.19C1044.15 1723.21 1041.85 1717.64 1045.49 1715.42C1114.97 1672.97 1174.65 1613.19 1218.13 1545.77C1225.28 1534.68 1231.99 1523.39 1238.22 1511.92C1242.69 1503.71 1233.07 1495.09 1225.36 1500.41C1112.62 1578.19 983.673 1617.09 831.412 1617.09C373.66 1617.09 220.454 1268.04 173.713 1103.94C172.183 1098.56 179.953 1095.88 182.057 1101.07C297.236 1384.81 560.899 1472.63 671.165 1497.59C680.788 1499.77 686.239 1486.89 677.931 1481.57C465.516 1345.32 395.703 1119.38 376.875 1043.04C375.859 1038.92 381.43 1036.63 383.642 1040.27C448.864 1147.12 540.218 1207.23 588.059 1233.38C596.164 1237.8 604.807 1228.38 599.667 1220.71C528.192 1114.07 481.834 978.465 481.834 835.146C481.834 307.497 889.808 189.425 1024.63 167.8C1029.09 167.082 1030.68 173.442 1026.41 174.948C724.888 281.76 630.114 552.535 602.596 669.544C600.3 679.31 613.438 684.737 618.734 676.214C745.676 471.832 980.577 399.318 1055.95 380.573C1060.07 379.545 1062.36 385.128 1058.73 387.339C952.437 452.203 892.247 543.008 865.924 590.968C861.429 599.157 871.064 607.764 878.751 602.444C991.575 524.526 1120.59 485.556 1272.98 485.556C1775.26 485.556 1909.45 885.198 1937.9 1021.54C1938.84 1026.04 1932.36 1027.85 1930.78 1023.52C1819.94 720.576 1542.62 629.449 1431.01 604.524H1431.04Z"/>
  </g>

  <!-- Scaled about its own centre, then moved - so the knobs above are read as
       "this wide, centred here" rather than as a chain of offsets. -->
  <g id="trophy" transform="translate(-14 -13.5) translate(115.0 113.5) scale(0.61538) translate(-115.0 -113.5)"
     stroke="#3A1D02" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- handles: a dark pass for the outline, a gold pass on top. The outline
         is what makes the cup read against the orange it sits on. -->
    <path d="M 91 81 C 76 79 68 89 71 100 C 73.5 108.5 84 112 95 109" fill="none" stroke-width="13"/>
    <path d="M 139 81 C 154 79 162 89 159 100 C 156.5 108.5 146 112 135 109" fill="none" stroke-width="13"/>
    <path d="M 91 81 C 76 79 68 89 71 100 C 73.5 108.5 84 112 95 109" fill="none" stroke="url(#handleGold)" stroke-width="6"/>
    <path d="M 139 81 C 154 79 162 89 159 100 C 156.5 108.5 146 112 135 109" fill="none" stroke="url(#handleGold)" stroke-width="6"/>

    <!-- cup -->
    <path d="M 89 77 C 89 94 94 110 100 119 C 103 123 105 125 107 126 L 123 126 C 125 125 127 123 130 119 C 136 110 141 94 141 77 Z" fill="url(#cupGold)"/>
    <path d="M 97 79 C 97 95 100 109 105 118 C 101 118 98 115 96 110 C 93 102 92 88 92.5 79 Z" fill="#FFF3C4" fill-opacity="0.45" stroke="none"/>
    <rect x="85" y="66" width="60" height="11" rx="5.5" fill="url(#rimGold)"/>

    <!-- stem and pedestal -->
    <path d="M 108 126 L 122 126 L 119.5 139 L 110.5 139 Z" fill="url(#stemGold)"/>
    <path d="M 105 139 L 125 139 L 130 150 L 100 150 Z" fill="url(#stemGold)"/>
    <rect x="94" y="149" width="42" height="12" rx="4" fill="url(#footGold)"/>
  </g>
</svg>
