<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 174" width="174" height="174" role="img" aria-label="Riftbound rankings">
  <title>Riftbound rankings</title>
  <!--
    The Rankings mark, built to the same composition as the Events mark
    (public/logo.png): Riot's Riftbound swirl, inset in the canvas, with a
    small object laid over its open centre and pushed down and to the right.

    Measured off logo.png so the pair reads as siblings rather than as two
    unrelated drawings:

      swirl       142px across, centred (86.5, 90.5) in a 174 canvas
      looking glass  58px lens, centred (100.5, 97) - 41% of the mark,
                     offset +14, +6.5 from its centre, handle trailing out

    The trophy is sized to about half the mark and given the same offset. It
    has no handle to carry the eye down-right the way the glass does, so it
    sits slightly further out than the lens and a little larger.

    The swirl is Riot's own published artwork, used verbatim and only scaled.
    Two earlier versions got this wrong in different ways: one redrew the
    spiral parametrically, which read as "some other orange spiral", and the
    next used the real path but bled it to all four canvas edges and dropped
    the trophy into the bottom-right corner, outside the swirl's core - so the
    two marks shared no structure at all. The trophy itself is original.
    Source: cmsassets.rgpub.io/.../6222c5f0...-2105x2105.svg (fill #EF7D00).
  -->
  <defs>
    <linearGradient id="cupGold" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#B8811B"/>
      <stop offset="22%" stop-color="#F7D873"/>
      <stop offset="52%" stop-color="#E8B22E"/>
      <stop offset="80%" stop-color="#B8811B"/>
      <stop offset="100%" stop-color="#9A6A12"/>
    </linearGradient>
    <linearGradient id="rimGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8811B"/>
      <stop offset="25%" stop-color="#FFF0B0"/>
      <stop offset="60%" stop-color="#E8B22E"/>
      <stop offset="100%" stop-color="#9A6A12"/>
    </linearGradient>
    <linearGradient id="stemGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8811B"/>
      <stop offset="30%" stop-color="#F7D873"/>
      <stop offset="100%" stop-color="#9A6A12"/>
    </linearGradient>
    <linearGradient id="footGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A6A12"/>
      <stop offset="30%" stop-color="#E8B22E"/>
      <stop offset="100%" stop-color="#7E550E"/>
    </linearGradient>
    <linearGradient id="handleGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7D873"/>
      <stop offset="100%" stop-color="#B8811B"/>
    </linearGradient>
  </defs>

  <g id="swirl" transform="translate(15.5 19.5) scale(0.06745843)">
